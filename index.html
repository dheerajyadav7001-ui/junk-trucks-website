<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Junk Trucks — Ottawa's #1 Eco-Friendly Junk Hauling & Property Cleanouts</title>
    <meta name="description" content="Ottawa's #1 Eco-Friendly Residential & Commercial Junk Removal Service. Upfront transparent pricing, same-day hauling, and eco-diversion donations." />
    <meta property="og:title" content="Junk Trucks — Ottawa's #1 Eco-Friendly Junk Hauling & Property Cleanouts" />
    <meta property="og:description" content="Ottawa's #1 Eco-Friendly Residential & Commercial Junk Removal Service. Upfront transparent pricing, same-day hauling, and eco-diversion donations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Poppins + IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

    <!-- Structured data (schema.org LocalBusiness): tells Google this is a
         real local business with a real rating, which is what can make a
         star rating show up directly in search results. Every value here
         is real -- do not inflate reviewCount/ratingValue beyond what the
         real Google Business Profile actually shows. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MovingCompany",
      "name": "Junk Trucks",
      "image": "https://junktrucks.ca/logo.png",
      "url": "https://junktrucks.ca",
      "telephone": "+13437770398",
      "email": "info@junktrucks.ca",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Ottawa",
        "addressRegion": "ON",
        "addressCountry": "CA"
      },
      "areaServed": [
        { "@type": "City", "name": "Ottawa" },
        { "@type": "Place", "name": "Kanata" },
        { "@type": "Place", "name": "Stittsville" },
        { "@type": "Place", "name": "Nepean" },
        { "@type": "Place", "name": "Barrhaven" },
        { "@type": "Place", "name": "Orléans" },
        { "@type": "Place", "name": "Gloucester" },
        { "@type": "Place", "name": "Westboro" },
        { "@type": "Place", "name": "Hintonburg" }
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5.0",
        "reviewCount": "7"
      }
    }
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 font-sans antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
