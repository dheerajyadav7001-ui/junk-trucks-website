<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Junk Trucks — Ottawa's #1 Eco-Friendly Junk Hauling & Property Cleanouts</title>
    <meta name="description" content="Ottawa's #1 Eco-Friendly Residential & Commercial Junk Removal Service. Upfront transparent pricing, same-day hauling, and eco-diversion donations." />
    <meta property="og:title" content="Junk Trucks — Ottawa's #1 Eco-Friendly Junk Hauling & Property Cleanouts" />
    <meta property="og:description" content="Ottawa's #1 Eco-Friendly Residential & Commercial Junk Removal Service. Upfront transparent pricing, same-day hauling, and eco-diversion donations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Inter + IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Structured data (schema.org LocalBusiness): tells Google this is a
         real local business serving these areas. Note: aggregateRating is
         deliberately NOT included here -- Google's structured-data policy
         makes a business ineligible for the star-rating rich result if it
         marks up ratings about itself on its own site ("self-serving
         reviews"). A real star rating has to come from Google's own
         aggregation of the Google Business Profile instead. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MovingCompany",
      "name": "Junk Trucks",
      "image": "https://junktrucks.ca/logo.png",
      "url": "https://junktrucks.ca",
      "telephone": "+13437770398",
      "email": "info@junktrucks.ca",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Ottawa",
        "addressRegion": "ON",
        "addressCountry": "CA"
      },
      "areaServed": [
        { "@type": "City", "name": "Ottawa" },
        { "@type": "Place", "name": "Kanata" },
        { "@type": "Place", "name": "Stittsville" },
        { "@type": "Place", "name": "Nepean" },
        { "@type": "Place", "name": "Barrhaven" },
        { "@type": "Place", "name": "Orléans" },
        { "@type": "Place", "name": "Gloucester" },
        { "@type": "Place", "name": "Westboro" },
        { "@type": "Place", "name": "Hintonburg" }
      ]
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
